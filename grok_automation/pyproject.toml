[project]
name = "grok-automation"
version = "0.1.0"
description = "PyQt6 desktop app to automate Grok image/video generation via Patchright + CDP"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyqt6>=6.7",
    "qasync>=0.27",
    "patchright>=1.49",
    "pydantic>=2.8",
    "loguru>=0.7",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grok", "ui", "workers"]
